<div class="py-12 bg-logo-cream border-t border-logo-sand border-opacity-35 mt-12">
  <!-- Section Title -->
  <app-section-title 
    title="Viajes de Promoción" 
    subtitle="Diversión grupal, seguridad garantizada y recuerdos para siempre"
    align="left">
  </app-section-title>

  <!-- Group Banner -->
  <div class="mb-10 p-6 bg-white bg-opacity-60 border border-logo-sand border-opacity-30 rounded-3xl flex flex-col md:flex-row md:items-center justify-between gap-6" data-aos="fade-up">
    <div class="max-w-xl text-left select-none">
      <h4 class="text-md font-black text-logo-dark">¿Eres docente, padre de familia o delegado de aula? 🏫</h4>
      <p class="text-xs text-logo-dark text-opacity-70 mt-1 font-semibold">Ofrecemos tarifas exclusivas todo incluido para colegios, con liberados (gratis para tutores), asistencia médica permanente y coordinadores durante todo el recorrido.</p>
    </div>
    <div class="shrink-0 w-full md:w-auto">
      <a routerLink="/contacto" class="w-full md:w-auto text-center block px-6 py-2.5 rounded-full bg-logo-orange text-white font-bold shadow-md hover:bg-logo-gold transition-all duration-300">
        Solicitar Cotización Grupal
      </a>
    </div>
  </div>

  <!-- Grid of Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" data-aos="fade-up">
    <div *ngFor="let tour of viajesPromocion" class="h-full">
      <app-card-tour [tour]="tour"></app-card-tour>
    </div>
  </div>
</div>

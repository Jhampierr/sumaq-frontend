<div class="py-12 bg-logo-cream">
  <!-- Section Title -->
  <app-section-title 
    title="Viajes Cortos" 
    subtitle="Escapadas perfectas de 2 a 4 días"
    align="left">
  </app-section-title>

  <!-- Grid of Cards -->
  <div class="mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" data-aos="fade-up">
    <div *ngFor="let tour of viajesCortos" class="h-full">
      <app-card-tour [tour]="tour"></app-card-tour>
    </div>
  </div>
</div>

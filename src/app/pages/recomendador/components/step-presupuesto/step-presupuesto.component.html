<div class="text-left space-y-6 select-none animate-fade-in">
  <div class="space-y-2">
    <h3 class="text-xl sm:text-2xl font-black text-logo-dark">Pregunta 2 de 15: Presupuesto estimado</h3>
    <p class="text-sm text-logo-dark text-opacity-60 font-semibold">¿Cuál es tu rango de inversión máximo estimado por persona?</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4">
    <!-- Option S/. 100 -->
    <div (click)="selectBudget(100)" 
         [ngClass]="value === 100 ? 'border-logo-orange bg-logo-orange bg-opacity-10 shadow-md text-logo-orange' : 'border-logo-sand bg-white text-logo-dark hover:border-logo-yellow hover:bg-logo-cream'"
         class="border-2 rounded-2xl p-4 cursor-pointer text-center flex flex-col items-center justify-center space-y-2 transition-all duration-300">
      <span class="text-2xl">💰</span>
      <span class="text-sm font-black leading-none">Hasta S/ 100</span>
      <span class="text-[10px] text-logo-dark text-opacity-50 font-bold">Económico</span>
    </div>

    <!-- Option S/. 200 -->
    <div (click)="selectBudget(200)" 
         [ngClass]="value === 200 ? 'border-logo-orange bg-logo-orange bg-opacity-10 shadow-md text-logo-orange' : 'border-logo-sand bg-white text-logo-dark hover:border-logo-yellow hover:bg-logo-cream'"
         class="border-2 rounded-2xl p-4 cursor-pointer text-center flex flex-col items-center justify-center space-y-2 transition-all duration-300">
      <span class="text-2xl">💵</span>
      <span class="text-sm font-black leading-none">S/ 100 - S/ 200</span>
      <span class="text-[10px] text-logo-dark text-opacity-50 font-bold">Estándar / Full Days</span>
    </div>

    <!-- Option S/. 450 -->
    <div (click)="selectBudget(450)" 
         [ngClass]="value === 450 ? 'border-logo-orange bg-logo-orange bg-opacity-10 shadow-md text-logo-orange' : 'border-logo-sand bg-white text-logo-dark hover:border-logo-yellow hover:bg-logo-cream'"
         class="border-2 rounded-2xl p-4 cursor-pointer text-center flex flex-col items-center justify-center space-y-2 transition-all duration-300">
      <span class="text-2xl">💳</span>
      <span class="text-sm font-black leading-none">S/ 200 - S/ 450</span>
      <span class="text-[10px] text-logo-dark text-opacity-50 font-bold">Intermedio / Cortos</span>
    </div>

    <!-- Option S/. 800 -->
    <div (click)="selectBudget(800)" 
         [ngClass]="value === 800 ? 'border-logo-orange bg-logo-orange bg-opacity-10 shadow-md text-logo-orange' : 'border-logo-sand bg-white text-logo-dark hover:border-logo-yellow hover:bg-logo-cream'"
         class="border-2 rounded-2xl p-4 cursor-pointer text-center flex flex-col items-center justify-center space-y-2 transition-all duration-300">
      <span class="text-2xl">💎</span>
      <span class="text-sm font-black leading-none">S/ 450 - S/ 800</span>
      <span class="text-[10px] text-logo-dark text-opacity-50 font-bold">Premium / Imperial</span>
    </div>

    <!-- Option S/. 1200 -->
    <div (click)="selectBudget(1200)" 
         [ngClass]="value === 1200 ? 'border-logo-orange bg-logo-orange bg-opacity-10 shadow-md text-logo-orange' : 'border-logo-sand bg-white text-logo-dark hover:border-logo-yellow hover:bg-logo-cream'"
         class="border-2 rounded-2xl p-4 cursor-pointer text-center flex flex-col items-center justify-center space-y-2 transition-all duration-300">
      <span class="text-2xl">👑</span>
      <span class="text-sm font-black leading-none">Más de S/ 1000</span>
      <span class="text-[10px] text-logo-dark text-opacity-50 font-bold">Ilimitado / Todo incluido</span>
    </div>
  </div>

  <div class="flex justify-between pt-4">
    <button (click)="onPrev()" class="px-6 py-2.5 rounded-full bg-logo-sand text-logo-gold font-bold hover:bg-logo-yellow hover:text-logo-dark transition-all duration-300">
      &larr; Atrás
    </button>
    <button (click)="onNext()" class="px-6 py-2.5 rounded-full bg-logo-orange text-white font-bold hover:bg-logo-gold shadow-md hover:shadow-lg transition-all duration-300">
      Siguiente &rarr;
    </button>
  </div>
</div>

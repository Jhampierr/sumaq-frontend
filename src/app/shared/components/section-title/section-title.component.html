<div class="mb-10" [ngClass]="{'text-center': align === 'center', 'text-left': align === 'left'}" data-aos="fade-up">
  <p *ngIf="subtitle" class="text-xs sm:text-sm font-black tracking-widest text-logo-orange uppercase mb-1">{{ subtitle }}</p>
  <h2 class="text-2xl sm:text-4xl font-black text-logo-dark tracking-tight leading-tight relative inline-block">
    {{ title }}
    <span class="absolute -bottom-2 h-1 bg-gradient-to-r from-logo-yellow to-logo-orange rounded-full"
          [ngClass]="{'left-1/2 -translate-x-1/2 w-20': align === 'center', 'left-0 w-12': align === 'left'}"></span>
  </h2>
</div>

<ng-container *ngIf="link; else actionButton">
  <a *ngIf="isExternalLink; else internalLink" [href]="link" target="_blank" rel="noopener noreferrer"
     [ngClass]="[
       'inline-flex items-center justify-center font-bold rounded-full transition-all duration-300 hover:scale-105 active:scale-95 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-logo-orange focus:ring-opacity-50 select-none text-center',
       styleType === 'primary' ? 'bg-gradient-to-r from-logo-orange to-accent-orange text-white hover:from-logo-gold hover:to-logo-orange' : '',
       styleType === 'secondary' ? 'bg-logo-sand text-logo-gold hover:bg-logo-yellow hover:text-logo-dark border border-logo-sand' : '',
       styleType === 'outline' ? 'bg-transparent text-logo-orange border-2 border-logo-orange hover:bg-logo-orange hover:text-white' : '',
       styleType === 'white' ? 'bg-white text-logo-gold hover:bg-logo-sand' : '',
       size === 'sm' ? 'px-4 py-1.5 text-xs sm:text-sm' : '',
       size === 'md' ? 'px-6 py-2.5 text-sm sm:text-base' : '',
       size === 'lg' ? 'px-8 py-3.5 text-base sm:text-lg' : ''
     ]"
     (click)="onClick($event)">
    <span>{{ text }}</span>
  </a>

  <ng-template #internalLink>
    <a [routerLink]="link"
       [ngClass]="[
         'inline-flex items-center justify-center font-bold rounded-full transition-all duration-300 hover:scale-105 active:scale-95 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-logo-orange focus:ring-opacity-50 select-none text-center',
         styleType === 'primary' ? 'bg-gradient-to-r from-logo-orange to-accent-orange text-white hover:from-logo-gold hover:to-logo-orange' : '',
         styleType === 'secondary' ? 'bg-logo-sand text-logo-gold hover:bg-logo-yellow hover:text-logo-dark border border-logo-sand' : '',
         styleType === 'outline' ? 'bg-transparent text-logo-orange border-2 border-logo-orange hover:bg-logo-orange hover:text-white' : '',
         styleType === 'white' ? 'bg-white text-logo-gold hover:bg-logo-sand' : '',
         size === 'sm' ? 'px-4 py-1.5 text-xs sm:text-sm' : '',
         size === 'md' ? 'px-6 py-2.5 text-sm sm:text-base' : '',
         size === 'lg' ? 'px-8 py-3.5 text-base sm:text-lg' : ''
       ]"
       (click)="onClick($event)">
      <span>{{ text }}</span>
    </a>
  </ng-template>
</ng-container>

<ng-template #actionButton>
  <button [type]="type"
          [disabled]="disabled"
          [ngClass]="[
            'inline-flex items-center justify-center font-bold rounded-full transition-all duration-300 hover:scale-105 active:scale-95 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-logo-orange focus:ring-opacity-50 disabled:opacity-50 disabled:cursor-not-allowed select-none text-center',
            styleType === 'primary' ? 'bg-gradient-to-r from-logo-orange to-accent-orange text-white hover:from-logo-gold hover:to-logo-orange' : '',
            styleType === 'secondary' ? 'bg-logo-sand text-logo-gold hover:bg-logo-yellow hover:text-logo-dark border border-logo-sand' : '',
            styleType === 'outline' ? 'bg-transparent text-logo-orange border-2 border-logo-orange hover:bg-logo-orange hover:text-white' : '',
            styleType === 'white' ? 'bg-white text-logo-gold hover:bg-logo-sand' : '',
            size === 'sm' ? 'px-4 py-1.5 text-xs sm:text-sm' : '',
            size === 'md' ? 'px-6 py-2.5 text-sm sm:text-base' : '',
            size === 'lg' ? 'px-8 py-3.5 text-base sm:text-lg' : ''
          ]"
          (click)="onClick($event)">
    <span>{{ text }}</span>
  </button>
</ng-template>
